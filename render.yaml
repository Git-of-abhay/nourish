databases:
  - name: nourish-db
    plan: free
    databaseName: nourish

services:
  - type: web
    name: nourish-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nourish-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
